<!doctype html>
<html lang="en">

<script>
   // Aplica o tema salvo antes de o React carregar (evita piscar branco).
   try {
     var t = localStorage.getItem("biblioteca_tema");
     if (t !== "claro" && t !== "escuro") {
       t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
     }
     document.documentElement.dataset.tema = t;
   } catch (e) {}
</script>

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LivroFav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
